name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-api:
    name: Lint API (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy app/

  lint-web:
    name: Lint Web (eslint + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  audit:
    name: Dependency audit (pip-audit + pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: pip-audit (backend)
        working-directory: apps/api
        run: |
          uv export --no-hashes -q > /tmp/api-reqs.txt
          # PYSEC-2026-1325 (ecdsa, transitive via python-jose): a pure-Python
          # timing side-channel the ecdsa maintainers have declined to fix.
          # No JWT in this codebase is signed/verified with ES256 (we use
          # HS256 exclusively — see app/core/security.py), so ecdsa's signing
          # path is never exercised; there is also no upstream fix version to
          # upgrade to. Re-evaluate if ES256 is ever adopted.
          uvx pip-audit -r /tmp/api-reqs.txt --ignore-vuln PYSEC-2026-1325
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: pnpm audit (frontend)
        working-directory: apps/web
        run: pnpm audit --audit-level=high

  test-api:
    name: Test API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tahaif_user
          POSTGRES_PASSWORD: tahaif_test_password
          POSTGRES_DB: tahaif_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://tahaif_user:tahaif_test_password@localhost:5432/tahaif_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --group dev
      - run: uv run pytest

  test-web:
    name: Test Web (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  e2e:
    name: E2E (playwright — 5 critical flows)
    runs-on: ubuntu-latest
    needs: [lint-api, lint-web, test-api, test-web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tahaif_user
          POSTGRES_PASSWORD: tahaif_dev_password
          POSTGRES_DB: tahaif
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      meilisearch:
        image: getmeili/meilisearch:latest
        env:
          MEILI_MASTER_KEY: e2e_master_key
          MEILI_ENV: development
        ports:
          - 7700:7700
      minio:
        # bitnami/minio's default entrypoint starts the server from env vars
        # alone — the official minio/minio image needs a `server /data` command
        # override, which the GitHub Actions `services:` block cannot express.
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: tahaif-media
        ports:
          - 9000:9000
    env:
      DATABASE_URL: postgresql+asyncpg://tahaif_user:tahaif_dev_password@localhost:5432/tahaif
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-e2e-secret-key-not-for-production
      MEILISEARCH_URL: http://localhost:7700
      MEILISEARCH_MASTER_KEY: e2e_master_key
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: tahaif-media
      S3_PUBLIC_URL: http://localhost:9000/tahaif-media
      ENVIRONMENT: test
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install API deps
        working-directory: apps/api
        run: uv sync --group dev
      - name: Run migrations
        working-directory: apps/api
        run: uv run alembic upgrade head
      - name: Seed catalog data
        working-directory: apps/api
        run: uv run python scripts/seed.py
      - name: Start API
        working-directory: apps/api
        run: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &

      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install web deps
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Start web app
        working-directory: apps/web
        run: pnpm dev &

      - name: Wait for API and web to be ready
        run: |
          npx --yes wait-on -t 60000 http://localhost:8000/api/v1/healthz http://localhost:3000

      - name: Run Playwright E2E suite
        working-directory: apps/web
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
