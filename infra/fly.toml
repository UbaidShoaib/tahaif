# fly.toml — Tahaif API on Fly.io
# Deploy: fly deploy --config infra/fly.toml --dockerfile infra/Dockerfile.api

app = "tahaif-api"
primary_region = "sin"  # Singapore (closest to Pakistan)

[build]
  dockerfile = "infra/Dockerfile.api"
  # Build context is the repo root so COPY apps/api/ works

[env]
  PORT = "8000"
  PYTHONUNBUFFERED = "1"
  # Remaining secrets injected via: fly secrets set KEY=value
  # Required: DATABASE_URL, REDIS_URL, SECRET_KEY, FRONTEND_URL
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/api/v1/healthz"
  protocol = "http"
  timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[deploy]
  strategy = "rolling"
  # Run Alembic migrations before traffic shifts to new version
  # (the image's venv is on PATH and WORKDIR holds alembic.ini)
  release_command = "alembic upgrade head"

# Scheduled jobs. Fly scheduled Machines run at most hourly, which suits the daily FX job:
#   fly machine run . --config infra/fly.toml --schedule daily \
#     --command "python -m app.workers.run fx"
# The outbox needs a tighter interval: set the JOBS_TOKEN secret and let
# .github/workflows/jobs.yml call /api/v1/internal/jobs/outbox every 15 minutes.
