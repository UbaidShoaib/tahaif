# Whole stack on one VPS (ADR 0007). Run from the repo root on the server:
#   docker compose --env-file .env.prod -f infra/docker-compose.prod.yml up -d --build
# or from a workstation: infra/deploy.sh user@host
#
# Only Caddy publishes ports. Web, API and media share one origin:
#   https://$DOMAIN/            -> web
#   https://$DOMAIN/api/*       -> api
#   https://$DOMAIN/$S3_BUCKET_NAME/* -> minio (signed links only; the bucket is private)
name: tahaif

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.prod}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-tahaif-media}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        # The API signs media links for https://$DOMAIN and uploads to the same
        # host; the alias keeps that traffic on the Docker network.
        aliases:
          - ${DOMAIN}
    depends_on:
      - web
      - api

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      secrets:
        - web_env
      # Rebuilds the web app when a NEXT_PUBLIC_* value changes (see Dockerfile.web).
      args:
        WEB_ENV_HASH: ${WEB_ENV_HASH:-}
    restart: unless-stopped
    environment:
      # Server components call the API over the Docker network.
      API_INTERNAL_URL: http://api:8000/api/v1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    # Provider keys (Stripe, Twilio, Resend, ...) come straight from .env.prod;
    # everything wired to this stack is set below and wins over the file.
    env_file:
      - ../.env.prod
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      # Caddy is the only proxy; use 2 if Cloudflare proxies in front of it.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      RUN_WORKER_IN_API: "1"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      FRONTEND_URL: https://${DOMAIN}
      GOOGLE_REDIRECT_URI: https://${DOMAIN}/api/v1/auth/oauth/google/callback
      DATABASE_URL: postgresql+asyncpg://tahaif:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@postgres:5432/tahaif
      REDIS_URL: redis://redis:6379/0
      MEILISEARCH_URL: http://meilisearch:7700
      S3_ENDPOINT_URL: https://${DOMAIN}
      S3_PUBLIC_URL: https://${DOMAIN}/${S3_BUCKET_NAME:-tahaif-media}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-tahaif-media}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-tahaif}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.prod}
      S3_REGION: us-east-1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tahaif
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tahaif
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tahaif -d tahaif"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persist the guest carts and the worker queue across restarts.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    # Pinned: Meilisearch cannot open a data directory written by another version.
    image: getmeili/meilisearch:v1.46.1
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?set MEILISEARCH_MASTER_KEY in .env.prod}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # MinIO no longer publishes images to Docker Hub; this is a community build
    # of the same source.
    image: &minio_image ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tahaif}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: create the (private) media bucket if it is missing.
  minio-init:
    image: *minio_image
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tahaif}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-tahaif-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set s3 http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing "s3/$$S3_BUCKET_NAME"
    depends_on:
      minio:
        condition: service_healthy

secrets:
  # Next.js reads NEXT_PUBLIC_* from this file while building (Dockerfile.web).
  web_env:
    file: ../.env.prod

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  meilisearch_data:
  minio_data:
